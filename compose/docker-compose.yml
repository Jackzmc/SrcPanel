services:
  app:
    image: admin-panel:latest
    build:
      context: ../
    volumes:
      - ./config:/app/server/config
      - ../server/data:/app/server/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8081:80
    env_file: .env

    # tty: true
    # stdin_open: true
    # command: /bin/bash
