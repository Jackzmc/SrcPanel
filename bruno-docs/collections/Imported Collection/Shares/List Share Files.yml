  url: "{{API_PROTOCOL}}://{{API_HOST}}/api/shares/:shareId/addons"
  params:
    - name: shareId
      value: addons
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
