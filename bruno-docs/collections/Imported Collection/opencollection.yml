opencollection: 1.0.0

info:
  name: Main
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: x-apikey
    value: "{{API_TOKEN}}"
    placement: header
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{WS_PROTOCOL}}://{{API_HOST}}/api/"
      defaultEnvironment: Dev
