info:
  name: Create Discussion
  type: http
  seq: 4

http:
  method: POST
  url: "{{API_HOST}}/api/discussions"
  body:
    type: json
    data: |-
      {
        "title": "My discussion",
        "description": "",
        "type": 1,
        "options": [
          {
            "label": "Option A"
          },
           {
            "label": "Option B"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
