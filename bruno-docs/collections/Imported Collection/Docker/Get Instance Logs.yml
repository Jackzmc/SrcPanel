info:
  name: Get Instance Logs
  type: http
  seq: 3

http:
  method: GET
  url: "{{API_PROTOCOL}}://{{API_DOMAIN}}/api/docker/instances/:id/logs"
  headers:
    - name: x-apikey
      value: "{{API_TOKEN}}"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
