info:
  name: Get Server Info
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_PROTOCOL}}://{{API_HOST}}/api/servers/:id"
  headers:
    - name: x-apikey
      value: "{{API_TOKEN}}"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
