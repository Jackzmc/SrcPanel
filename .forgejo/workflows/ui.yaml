name: Build UI Image
on:
  push:
    paths:
      - 'nuxt/**'
      - 'common-types/**'
      - '.forgejo/workflows/ui.yaml'
      - Dockerfile
      - pnpm-*.yml
    # branches:
    #   - release
    #   - feat/*
  workflow_dispatch: {}

env:
  BASE_IMAGE_NAME: git.jackz.me/${{ github.repository_owner }}/admin-panel

jobs:
  build:
    runs-on: debian-latest
    steps:
      - name: Checkout
        uses: https://git.jackz.me/actions/checkout@v4
      - name: Login to Local Container Registry
        uses: https://git.jackz.me/actions/docker-login-action@v3
        with:
          registry: https://git.jackz.me
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Login to docker.io Container Registry
        uses: https://git.jackz.me/actions/docker-login-action@v3
        with:
          username: ${{ vars.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_TOKEN }}
      - name: Set up Docker Buildx
        uses: https://git.jackz.me/actions/docker-setup-buildx-action@v3
      # replace / with - for tag
      - name: Set ENV
        run: echo "TAG=${FORGEJO_REF_NAME////-}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: https://git.jackz.me/actions/docker-build-push-action@v6
        with:
          push: true
          context: . # need to keep .git folder
          cache-from: type=registry,ref=${{ env.BASE_IMAGE_NAME }}-ui:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE_NAME }}-ui:buildcache,mode=max
          tags: ${{ env.BASE_IMAGE_NAME }}-ui:${{ env.TAG }}
          target: final-ui