name: UI
run-name: UI
on: 
  push:
    paths:
      - 'ui/**'
      - 'common-types/**'
      - '.forgejo/workflows/ui.yaml'
    branches:
      - release
  workflow_dispatch: {}
    
defaults:
  run:
    working-directory: ui
jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: 'ui/yarn.lock'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: git rev-parse HEAD > dist/.git-commit
      - name: 'Tar files'
        run: tar -cvf dist.tar ui/dist
      - uses: forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
  deploy:
    runs-on: docker
    needs: [build]
    steps:
      - uses: forgejo/download-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
      - uses: https://git.jackz.me/jackz/ssh-scp-deploy.git@v3
        with:
          src: dist.tar.gz
          remote: ${{ vars.SSH_UI_PATH }}
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          extract: true