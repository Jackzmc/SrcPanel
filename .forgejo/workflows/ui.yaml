name: UI
run-name: UI
on: 
  push:
    paths:
      - 'ui/**/*'
      - 'common-types/**/*'
    branches:
      - release
  workflow_dispatch: {}
    
defaults:
  run:
    working-directory: ui
jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache-dependency-path: 'ui'
          # cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: ls
      - run: yarn build
      - run: git rev-parse HEAD > dist/.git-commit
      - uses: forgejo/upload-artifact@v4
        with:
          name: dist
          path: ui/dist
  deploy:
    runs-on: docker
    needs: [build]
    steps:
      - uses: forgejo/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: https://git.jackz.me/jackz/scp-deploy@master
        with:
          src: dist
          remote: ${{ vars.SSH_REMOTE_PATH }}
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}