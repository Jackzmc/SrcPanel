name: UI
run-name: UI
on: 
  push:
    branches:
      - release
defaults:
  run:
    working-directory: ui
jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache-dependency-path: 'ui'
          # cache: 'yarn'
      - run: ls
      - run: yarn build
      