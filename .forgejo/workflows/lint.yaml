name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-full

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: 🔧 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Lint Server
        run: cd server && pnpm lint

      - name: Lint UI
        run: cd ui && pnpm lint && pnpm tsc
