name: Lint

on:
  push:
    branches:
      - master
    paths:
      - common-types/*
      - server/*
      - nuxt/*
      - '.forgejo/workflows/lint.yaml'
      

jobs:
  lint:
    name: Run linters
    runs-on: debian-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Check out Git repository
        uses: https://git.jackz.me/actions/checkout@v4

      - name: Install pnpm
        uses: https://git.jackz.me/actions/pnpm-action-setup@v4
        with:
          version: 11

      - name: Setup node
        uses: https://git.jackz.me/actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint Common
        run: cd common-types && pnpm tsc
      - name: Lint Server
        run: cd server && pnpm lint
      - name: Lint UI
        run: cd nuxt && pnpm lint && pnpm tsc

