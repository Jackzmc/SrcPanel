name: Build Server Image
on:
  push:
    paths:
      - 'server/**'
      - 'common-types/**'
      - '.forgejo/workflows/server.yaml'
      - Dockerfile
      - pnpm-*.yml
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch: {}

env:
  BASE_IMAGE_NAME: git.jackz.me/${{ github.repository_owner }}/srcpanel

jobs:
  build:
    runs-on: debian-latest
    steps:
      - name: Checkout
        uses: https://git.jackz.me/actions/checkout@v4
      - name: Metadata
        uses: https://git.jackz.me/actions/docker-metadata-action@v6.1.0
        id: meta
        with:
          images: |
            ${{ env.BASE_IMAGE_NAME }}-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Login to Local Container Registry
        uses: https://git.jackz.me/actions/docker-login-action@v3
        with:
          registry: https://git.jackz.me
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Login to docker.io Container Registry
        uses: https://git.jackz.me/actions/docker-login-action@v3
        with:
          username: ${{ vars.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_TOKEN }}
      - name: Set up Docker Buildx
        uses: https://git.jackz.me/actions/docker-setup-buildx-action@v3
      - name: Build and push
        uses: https://git.jackz.me/actions/docker-build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE_NAME }}-server:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE_NAME }}-server:buildcache,mode=max
          context: . # need to keep .git folder
          target: final-server
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
