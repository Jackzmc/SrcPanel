name: Build Image
on: 
  push:
    paths:
      - 'server/**'
      - 'ui/**'
      - 'common-types/**'
      - '.forgejo/workflows/docker.yaml'
    branches:
      - release
      - feat/*
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-full
    steps:
      - uses: actions/checkout@v4
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.jackz.me
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # - name: Set up QEMU
        # uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set ENV
        run: TAG=${FORGEJO_REF_NAME////-}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: . # need to keep .git folder
          # change branch slashes to dash
          tags: git.jackz.me/${{ github.repository_owner }}/admin-panel:${{ env.TAG }}