name: Build Image
on:
  push:
    paths:
      - 'server/**'
      - 'ui/**'
      - 'common-types/**'
      - '.forgejo/workflows/docker.yaml'
      - Dockerfile
    # branches:
    #   - release
    #   - feat/*
  workflow_dispatch: {}

env:
  IMAGE_NAME: git.jackz.me/${{ github.repository_owner }}/admin-panel

jobs:
  build:
    runs-on: ubuntu-full
    steps:
      - uses: https://git.jackz.me/actions/checkout@v4
      - name: Login to Container Registry
        uses: https://git.jackz.me/actions/docker-login-action@v3
        with:
          registry: https://git.jackz.me
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Set up Docker Buildx
        uses: https://git.jackz.me/actions/docker-setup-buildx-action@v3
      # replace / with - for tag
      - name: Set ENV
        run: echo "TAG=${FORGEJO_REF_NAME////-}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: https://git.jackz.me/actions/docker-build-push-action@v6
        with:
          push: true
          context: . # need to keep .git folder
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
