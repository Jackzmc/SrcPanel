name: Build Image
on: 
  push:
    paths:
      - 'server/**'
      - 'ui/**'
      - 'common-types/**'
      - '.forgejo/workflows/docker.yaml'
    # branches:
      # - release
      # - feat/*
  workflow_dispatch: {}

env:
  IMAGE_NAME: git.jackz.me/${{ github.repository_owner }}/admin-panel

jobs:
  build:
    runs-on: ubuntu-full
    steps:
      - uses: actions/checkout@v4
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.jackz.me
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # - name: Set up QEMU
        # uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # replace / with - for tag
      - name: Set ENV
        run: echo "TAG=${FORGEJO_REF_NAME////-}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: . # need to keep .git folder
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
  deploy:
    runs-on: ubuntu-full
    needs: build
    if: forge.ref == 'refs/heads/master' || forge.ref == 'refs/heads/release'
    steps:
      - name: Install SSH Key
        uses: https://github.com/shimataro/ssh-key-action@v2.7.0
        with:
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          name: id_rsa # optional
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
      - name: Update container (staging)
        if: ${{ github.ref == 'refs/heads/master' }}
        run: ssh deploy@${{ secrets.REMOTE_HOST }} -C "docker compose -f /home/deploy/composes/admin-panel/staging/docker-compose.yml up -d --pull always "
      - name: Update container (production)
        if: ${{ github.ref == 'refs/heads/release' }}
        run:  ssh deploy@${{ secrets.REMOTE_HOST }} -C "docker compose -f /home/deploy/composes/admin-panel/production/docker-compose.yml up -d --pull always "